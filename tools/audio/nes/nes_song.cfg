# ld65 layout of a song (FamiStudio music data at NES_SONG_BASE). Song data and samples share
# $8C00-$FFF9: a song with samples must also end below its sample block (checked by the image loader).
MEMORY {
    SONG: start = $8C00, size = $73FA, type = ro, file = %O, fill = no;
}
SEGMENTS {
    SONG: load = SONG, type = ro;
}
