# ld65 layout of the NES preview player (tools/audio/prepare_nes_player.py). Every build links its code from $8000
# (fill = no: the output is exactly the player's bytes, whatever PRG's size); PRG reaches up to the lowest sample address
# so the largest build (EPSM) fits, and the script checks each build ends below its song base.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, file = "";
    RAM: start = $0200, size = $0600, type = rw, file = "";
    PRG: start = $8000, size = $4000, type = ro, file = %O, fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, define = yes;
    CODE:     load = PRG, type = ro;
}
