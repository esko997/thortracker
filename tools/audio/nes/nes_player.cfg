# ld65 layout of the NES preview player (tools/audio/prepare_nes_player.py). PRG ends where the
# song region starts; the script checks the player fits.
MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, file = "";
    RAM: start = $0200, size = $0600, type = rw, file = "";
    PRG: start = $8000, size = $2000, type = ro, file = %O, fill = no;
}
SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp;
    BSS:      load = RAM, type = bss, define = yes;
    CODE:     load = PRG, type = ro;
}
