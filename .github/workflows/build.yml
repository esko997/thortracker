name: build
on:
  # Every branch push is built and tested; only main can publish (see the release job's condition).
  push: { branches: ['**'] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch or PR supersedes a running build, except on main, where a run may be publishing.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Read the app version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versionName \"$version\" is not x.y.z" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unit tests (core and app), core Linux build, debug and (unsigned) release builds, sample export
        run: ./gradlew --no-daemon --console=plain :core:jvmTest :core:linuxX64Test testDebugUnitTest assembleDebug assembleRelease exportSamples
      - name: The factory song still exports byte-identically
        run: cmp app/build/samples/thor-groove.uge examples/thor-groove.uge
      - name: A new version also raises versionCode above the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Otherwise the published APK could not update over the previous release.
          if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then echo "v$VERSION is already released."; exit 0; fi
          latest=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          [ -n "$latest" ] || { echo 'No earlier release.'; exit 0; }
          gh release download "$latest" --pattern '*.apk' --dir "$RUNNER_TEMP/latest"
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2
          previous=$("$aapt2" dump badging "$RUNNER_TEMP"/latest/*.apk | sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p")
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          echo "versionCode $code (latest release $latest: $previous)"
          (( code > previous )) || { echo "Bump versionCode above $previous for v$VERSION" >&2; exit 1; }
      - name: Native chip-engine tests, Game Boy and NES (host gcc)
        run: tools/audio/run_native_host_test.sh "$RUNNER_TEMP/audio-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thor-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Keep test reports of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

  # The Steam Deck / desktop Linux frontend: SDL3 built from source, the Kotlin/Native release executable, an AppImage.
  deck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Read the app version
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: SDL3 build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev libgl1-mesa-dev \
            libgles2-mesa-dev libdrm-dev libgbm-dev libpipewire-0.3-dev libpulse-dev libasound2-dev libudev-dev libdbus-1-dev
      - name: Build SDL3 from source
        run: deck/tools/build-sdl3.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Release executable
        run: ./gradlew --no-daemon --console=plain :deck:linkReleaseExecutableLinuxX64
      - name: AppImage
        run: deck/tools/package-appimage.sh "${{ steps.version.outputs.version }}"
      - name: The AppImage starts, draws and opens the menu (offscreen video, no audio device)
        shell: bash
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          out=$(HOME="$home" APPIMAGE_EXTRACT_AND_RUN=1 SDL_VIDEO_DRIVER=offscreen SDL_AUDIO_DRIVER=dummy \
            timeout 60 "dist/thor-tracker-${{ steps.version.outputs.version }}-x86_64.AppImage" seconds=3 script=110 2>&1)
          echo "$out" | grep -E '^(SDL|script|frames|screenshot)'
          grep -q 'popup=Thor Tracker' <<< "$out"
          grep -q 'screenshot: true' <<< "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thor-tracker-appimage
          path: |
            dist/thor-tracker-*-x86_64.AppImage
            dist/thor-tracker-*-x86_64.AppImage.sha256
          if-no-files-found: error

  # A version bump on main publishes it: when no release v<versionName> exists yet, sign and publish that commit.
  release:
    needs: build
    if: github.repository == 'esko997/thortracker' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: signed-release
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.publish }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Publish only a version that has no release yet
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "$TAG is already released; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.publish.outputs.publish == 'true'
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.publish.outputs.publish == 'true'
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: steps.publish.outputs.publish == 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      # No Gradle cache action in the signing job: no signing-run state is saved or restored.
      - name: Build and verify with the release key
        if: steps.publish.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.THORTRACKER_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THORTRACKER_RELEASE_KEYSTORE_PASSWORD }}
          THORTRACKER_SIGNING_DIR: ${{ runner.temp }}/thortracker-signing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -rf -- "$THORTRACKER_SIGNING_DIR"' EXIT
          [[ -n $KEYSTORE_BASE64 && -n $KEYSTORE_PASSWORD ]] || { echo 'Release signing secrets are missing' >&2; exit 1; }
          mkdir -m 700 "$THORTRACKER_SIGNING_DIR"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$THORTRACKER_SIGNING_DIR/thortracker-release.p12"
          printf '%s\n' "$KEYSTORE_PASSWORD" > "$THORTRACKER_SIGNING_DIR/store-password"
          unset KEYSTORE_BASE64 KEYSTORE_PASSWORD
          tools/release.sh
      - name: Release notes from docs/VERIFICATION.md
        if: steps.publish.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The section whose heading starts with "## <version> ", up to the next "## " heading.
          awk -v v="$VERSION" 'index($0, "## " v " ") == 1 { on = 1 } on && /^## / && index($0, "## " v " ") != 1 { exit } on' \
            docs/VERIFICATION.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "docs/VERIFICATION.md has no \"## $VERSION ...\" section" >&2; exit 1; }
          printf '\n---\nVerify the download: `sha256sum -c thor-tracker-%s.apk.sha256`. Signed with the Thor Tracker release key (certificate SHA-256 `d12064692cbaa5c2feecf3cf5a2d3719a088e7bafe1ffa55e1f00aeecafed469`).\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
      - name: Publish the release
        if: steps.publish.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Thor Tracker $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/thor-tracker-$VERSION.apk" "dist/thor-tracker-$VERSION.apk.sha256"

  # The Deck AppImage joins a release the signed APK already published. It never holds up the APK: if the deck job
  # failed, this is skipped and the release stays APK-only.
  release-appimage:
    needs: [build, release, deck]
    if: needs.release.outputs.published == 'true' && needs.deck.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: thor-tracker-appimage
          path: dist
      - name: Attach the AppImage to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/thor-tracker-$VERSION-x86_64.AppImage" "dist/thor-tracker-$VERSION-x86_64.AppImage.sha256"
          notes=$(gh release view "$TAG" --json body --jq .body)
          printf '%s\n\nSteam Deck / Linux: `thor-tracker-%s-x86_64.AppImage` (see the README, "Steam Deck").\n' "$notes" "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
