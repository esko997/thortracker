name: Documentation Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'deck/README.md'
      - 'deck/deck-pattern.png'
      - 'deck/fonts/**'
      - 'app/src/main/assets/**'
      - 'third_party/damusc/NOTICE'
      - 'core/src/commonMain/kotlin/org/thortracker/system/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - 'deck/**'
      - 'app/src/main/assets/**'
      - 'third_party/damusc/NOTICE'
      - 'core/src/commonMain/kotlin/org/thortracker/system/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.12'
      - name: Install hash-locked Markdown renderer
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r site/requirements.txt
      - name: Check transformation boundaries
        run: python -m unittest discover -s site -p 'test_*.py'
      - name: Build site and validate local URLs, fragments and assets
        run: python site/build.py --base /thortracker/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/_build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
